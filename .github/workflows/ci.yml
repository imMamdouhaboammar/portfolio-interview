name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Run repository selftest
        run: bun scripts/selftest.mjs
      - name: Validate full skill packs
        run: node scripts/skills-selftest.mjs
      - name: Validate Claude marketplace
        run: node scripts/marketplace-selftest.mjs
